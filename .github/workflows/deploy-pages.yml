# RATEOS — despliegue a GitHub Pages: SÓLO producción.
#
#   https://<owner>.github.io/COTIZADORWEB/   ← producción: SIEMPRE main
#
# Sin staging público (HD-02, PLAN-2026-016): el preview en /preview/ compartía
# el origen y la base de datos de producción (el código de cualquier rama con
# CI verde corría junto a las sesiones y los datos reales). Ya no se publica
# ninguna rama: Pages sirve UN artefacto por deploy y lo reemplaza entero, así
# que el próximo deploy de producción borra también los archivos del preview
# viejo. Después de publicar se verifica que /preview/ responda 404. Un staging
# nuevo tiene que ser AISLADO (otro origen y otro proyecto de Supabase): ver
# docs/BETA_PERIMETER.md. Nunca volver a publicarlo dentro de este sitio.
#
# Cuándo corre:
# - push a main: publica main.
# - Manual (workflow_dispatch): "ref" = rollback a un commit o tag ya mergeado
#   en main (vacío = main actual).
#
# Garantías:
# - Sólo se construye y publica código que está en main y pasó los tests.
# - El build no tiene permisos de escritura; sólo el job deploy (que no ejecuta
#   código del repo) puede escribir en Pages.
# - El artefacto nunca trae una carpeta preview/ (el build falla si aparece).
# - Producción nunca vuelve atrás sola: justo antes de publicar se verifica
#   que su commit siga siendo el último de main (salvo un rollback manual).
# - Si los tests fallan, no se despliega nada.
#
# Requisito: Settings → Pages → Source = "GitHub Actions". Sin secretos.

name: Deploy RATEOS a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Producción: commit SHA o tag YA MERGEADO en main (vacío = main actual). Usar para rollback."
        required: false
        default: ""
        type: string

# Permisos mínimos: por defecto sólo lectura. Sólo el job deploy escribe.
permissions:
  contents: read

# Concurrencia: sólo en el job deploy (más abajo), para que una corrida nunca
# cancele un despliegue en curso.

jobs:
  plan:
    name: Qué se publica
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.root.outputs.sha }}
      root_ref: ${{ steps.root.outputs.ref }}
    steps:
      - name: Checkout (main y tags)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Producción → commit de main
        id: root
        env:
          # Por variable de entorno (nunca interpolado en el script): sin inyección.
          REQUESTED_REF: ${{ inputs.ref }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${REQUESTED_REF}" ]; then
            REF="$REQUESTED_REF"
          elif [ "$EVENT_NAME" = "push" ]; then
            REF="$PUSH_SHA"
          else
            REF="origin/main"
          fi
          if ! printf '%s' "$REF" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$'; then
            echo "::error::Ref inválida: '$REF'. Usá un SHA o un tag (letras, números, . _ / -)."
            exit 1
          fi
          SHA="$(git rev-parse --verify --quiet "${REF}^{commit}" || true)"
          if [ -z "$SHA" ]; then
            echo "::error::No se encontró el commit o tag '$REF'."
            exit 1
          fi
          # Producción sólo publica código que ya está en main (revisado por PR).
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::'$REF' no está en main: producción sólo publica commits o tags ya mergeados."
            exit 1
          fi
          LABEL="main"
          if [ -n "${REQUESTED_REF}" ]; then LABEL="$REQUESTED_REF"; fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "ref=$LABEL" >> "$GITHUB_OUTPUT"
          echo "Producción: $SHA ($LABEL)"

  test:
    name: Tests (producción)
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (commit de producción)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verificar que no hay dependencias npm
        # RATEOS no usa dependencias (ni runtime ni dev), por eso no hay npm ci.
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const fields = ["dependencies", "devDependencies", "optionalDependencies", "peerDependencies", "bundleDependencies", "bundledDependencies"];
            const bad = fields.filter((f) => pkg[f] && Object.keys(pkg[f]).length > 0);
            if (bad.length) { console.error("package.json declara dependencias: " + bad.join(", ")); process.exit(1); }
            if (fs.existsSync("package-lock.json")) {
              const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
              const pkgs = Object.keys(lock.packages || {}).filter((k) => k !== "");
              const deps = Object.keys(lock.dependencies || {});
              if (pkgs.length || deps.length) { console.error("package-lock.json contiene dependencias."); process.exit(1); }
            }
            console.log("Sin dependencias npm: OK");
          '

      - name: Tests (npm test)
        run: npm test

  build:
    name: Build
    needs: [plan, test]
    # Producción siempre necesita sus tests en verde.
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read # actions/configure-pages sólo lee la configuración de Pages
    outputs:
      version: ${{ steps.info.outputs.version }}
      commit: ${{ steps.info.outputs.commit }}
      ref: ${{ steps.info.outputs.ref }}
      build_date: ${{ steps.info.outputs.build_date }}
      # Para que deploy verifique que producción sigue siendo el último commit de main.
      root_sha: ${{ needs.plan.outputs.sha }}
      root_ref: ${{ needs.plan.outputs.root_ref }}
    steps:
      - name: Checkout (mismo commit que pasó los tests)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build de producción (dist/ + version.json)
        run: npm run build
        env:
          BUILD_REF: ${{ needs.plan.outputs.root_ref }}
          BUILD_SHA: ${{ needs.plan.outputs.sha }}

      - name: Sin staging en el artefacto de producción (HD-02)
        run: |
          set -euo pipefail
          if [ -e dist/preview ]; then
            echo "::error::dist/ trae una carpeta preview/: el staging no se publica en el origen de producción (HD-02)."
            exit 1
          fi
          echo "Artefacto sin preview/: OK"

      - name: Leer version.json
        id: info
        run: |
          node -e '
            const fs = require("fs");
            const v = JSON.parse(fs.readFileSync("dist/version.json", "utf8"));
            const out = [
              "version=" + v.version,
              "commit=" + v.commit,
              "ref=" + v.ref,
              "build_date=" + v.buildDate,
            ].join("\n") + "\n";
            fs.appendFileSync(process.env.GITHUB_OUTPUT, out);
            console.log(JSON.stringify(v));
          '

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    # Un solo despliegue a la vez; nunca se cancela uno en curso. Si se acumulan,
    # gana el más nuevo: una corrida cuyo commit de main ya no es el último no
    # publica (ver "Producción vigente").
    concurrency:
      group: "pages"
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Producción nunca vuelve atrás sola. Cada corrida elige el commit de main
      # al empezar: si main avanzó mientras esperaba, no se publica nada; la
      # corrida del commit nuevo publica la versión vigente. No aplica a un
      # rollback pedido a mano ("ref" en workflow_dispatch). Se consulta el
      # repositorio público con git ls-remote, sin credenciales ni checkout.
      - name: Producción vigente (último commit de main)
        id: main_guard
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          ROOT_SHA: ${{ needs.build.outputs.root_sha }}
          ROOT_REF: ${{ needs.build.outputs.root_ref }}
        run: |
          set -euo pipefail
          if [ "$ROOT_REF" != "main" ]; then
            echo "Rollback pedido a mano (${ROOT_REF}): se publica ${ROOT_SHA:0:7}."
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MAIN_SHA="$(git ls-remote "$REPO_URL" refs/heads/main | cut -f1)"
          if [ -z "$MAIN_SHA" ]; then
            echo "::error::No se pudo leer el último commit de main: no se publica."
            exit 1
          fi
          if [ "$MAIN_SHA" != "$ROOT_SHA" ]; then
            echo "::notice::main avanzó a ${MAIN_SHA:0:7} mientras esta corrida esperaba (iba a publicar ${ROOT_SHA:0:7}): no se publica para no volver atrás producción. La publica la corrida del commit nuevo."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Producción vigente: main@${ROOT_SHA:0:7}"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Desplegar en GitHub Pages
        id: deployment
        if: steps.main_guard.outputs.publish == 'true'
        uses: actions/deploy-pages@v4

      # Prueba de que quedó publicado lo que se construyó y de que no queda
      # ningún staging viejo (HD-02): version.json con el commit desplegado y
      # /preview/ respondiendo 404. Pages tarda unos segundos en servir el
      # artefacto nuevo: se reintenta hasta ~4 minutos, sin caché (?t=).
      - name: Verificar el sitio publicado (versión y /preview/ → 404)
        if: steps.main_guard.outputs.publish == 'true'
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          set -uo pipefail
          for attempt in $(seq 1 24); do
            T="$(date +%s)"
            COMMIT="$(curl -fsS --max-time 15 "${PAGE_URL}version.json?t=${T}" 2>/dev/null | node -e 'let s="";process.stdin.on("data",(d)=>s+=d).on("end",()=>{try{const v=JSON.parse(s);process.stdout.write(typeof v.commit==="string"?v.commit:"")}catch{process.stdout.write("")}})')"
            PREVIEW_DIR="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "${PAGE_URL}preview/?t=${T}" || true)"
            PREVIEW_VERSION="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "${PAGE_URL}preview/version.json?t=${T}" || true)"
            if [ "$COMMIT" = "$EXPECTED_COMMIT" ] && [ "$PREVIEW_DIR" = "404" ] && [ "$PREVIEW_VERSION" = "404" ]; then
              echo "Publicado ${COMMIT}; /preview/ → 404 y /preview/version.json → 404 (sin staging)."
              exit 0
            fi
            echo "Intento ${attempt}: commit='${COMMIT}' (esperado ${EXPECTED_COMMIT}), /preview/=${PREVIEW_DIR}, /preview/version.json=${PREVIEW_VERSION}"
            sleep 10
          done
          echo "::error::El sitio publicado no coincide con el build o /preview/ todavía responde: revisar Pages (HD-02)."
          exit 1

      - name: Resumen del despliegue
        if: steps.main_guard.outputs.publish == 'true'
        env:
          APP_VERSION: ${{ needs.build.outputs.version }}
          APP_COMMIT: ${{ needs.build.outputs.commit }}
          APP_REF: ${{ needs.build.outputs.ref }}
          APP_BUILD_DATE: ${{ needs.build.outputs.build_date }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          {
            echo "## RATEOS desplegado en GitHub Pages"
            echo ""
            echo "| Campo | Valor |"
            echo "|---|---|"
            echo "| Producción: versión | \`${APP_VERSION}\` |"
            echo "| Producción: commit | \`${APP_COMMIT}\` (\`${APP_REF}\`) |"
            echo "| Fecha de build (UTC) | ${APP_BUILD_DATE} |"
            echo "| Staging | sin staging público (HD-02): \`${PAGE_URL}preview/\` → 404 |"
            echo "| Disparado por | ${EVENT_NAME} |"
            echo "| URL | ${PAGE_URL} |"
          } >> "$GITHUB_STEP_SUMMARY"
